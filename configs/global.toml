[paths]
# Folder containing calendar.csv, sell_prices.csv, sales_train_evaluation.csv
m5_input_dir = "data"

[global.lgbm]
horizon = 28
start_day = 1200
buffer = 60
seed = 42

# Feature engineering (notebook-aligned defaults)
lags = [28, 35, 42, 49]
rolling_shift = 28
rolling_windows = [7, 28, 49]

# Tuning (Optuna)
tune = true
tune_frac = 0.1
n_trials = 15
nfold = 3
num_boost_round_cv = 500

# Final training (LightGBM)
objective = "tweedie"
metric = "rmse"
num_boost_round = 1500
early_stopping_rounds = 100
log_evaluation = 50
bin_construct_sample_cnt = 200000
num_threads = -1
verbose = -1

[global.nbeatsx]
horizon = 28
start_day = 1200
alias = "NBEATSx_MQLoss_Global"
log_name = "nbeats_mqloss_global"
prefer_mps = true

freq = "D"
input_size = 370
scaler_type = "robust"
max_steps = 8000
val_size = 28
val_check_steps = 100
early_stop_patience_steps = 15
dropout_prob_theta = 0.2
batch_size = 512
devices = 1
enable_progress_bar = false
exclude_insample_y = false

learning_rate = 0.0005
quantiles = [0.5, 0.8, 0.9]

futr_exog_list = ["sell_price", "is_available", "snap_active", "is_event"]

[global.nbeatsx.lr_scheduler_kwargs]
T_0 = 2000
T_mult = 4
eta_min = 0.000001
