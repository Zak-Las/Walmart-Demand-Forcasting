name: wdf
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pytest
  - ruff
  - black
  - ipykernel
  - jupyterlab
  - nbconvert
  - numpy
  - pandas
  - pyarrow
  - scikit-learn
  - scipy
  - matplotlib
  - seaborn
  - pip:
      # Core modeling stack (CPU-friendly in Linux containers)
      - lightgbm==4.6.0
      - optuna==4.6.0
      - pytorch-lightning==2.5.5
      - torch==2.8.0
      - neuralforecast==3.1.2
      # Misc
      - rich==14.2.0
      - tqdm==4.67.1
      - tomli==2.4.0
      - kaggle==1.7.4.5
