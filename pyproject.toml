[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "walmart-demand-forecasting"
version = "0.1.0"
description = "Walmart demand forecasting (M5) portfolio project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
wdf = "walmart_demand_forecasting.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["walmart_demand_forecasting*"]
